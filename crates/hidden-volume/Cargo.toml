[package]
name = "hidden-volume"
version = "2.2.2"
edition = "2024"
rust-version = "1.89"
description = "Deniable multi-space encrypted append-only container"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "hidden_volume"
path = "src/lib.rs"

[features]
# `hv` command-line utility (binary target). Pulls in clap for argument
# parsing. Useful for debugging, migration, scripted compaction.
cli = ["dep:clap"]
# Parallelizes the open-time discovery scan via rayon. Optional because:
# (a) on single-core mobile (Cortex-A53) rayon adds no value while
# pulling ~6 MB of dependency code, (b) the sequential streaming scan
# is already O(N) AEAD-decrypts dominated; parallel only wins on
# multi-core hosts. cfg(unix) only — relies on `pread` for
# concurrent positional reads from a shared `&File` handle.
parallel-scan = ["dep:rayon"]
# Zero-copy memory-mapped read path for the open-time discovery scan.
#
# OFF BY DEFAULT, and it should stay off unless the host owns the directory
# its containers live in. `Mmap::map` is `unsafe` because mutation under the
# mapping breaks Rust's aliasing rules, and a truncate under it raises SIGBUS
# — a process abort, not an error. The flock this path relies on is ADVISORY:
# it excludes writers that ask for the lock, not a same-user process that
# does not, and that needs no unusual filesystem (report16 HV16-M1).
#
# The default `pread` path turns the same truncate into a short read.
# On small containers there is no measurable win here anyway. cfg(unix) only.
mmap = ["dep:memmap2"]
# Exposes `open::test_hooks` — the open-scan fast-path counter and its
# disable switch — to code OUTSIDE this crate.
#
# The seam already existed for in-crate `#[cfg(test)]` use (checkpoint.rs,
# reuse_tests.rs). `#[cfg(test)]` is invisible to `tests/*.rs`, which are
# separate crates compiled against a NON-test build of the lib, so an
# integration test could not ask whether the fast path engaged. That matters
# for `tests/open_peak_memory_fast_path.rs`: measuring the fast path's peak
# allocation needs a `#[global_allocator]`, which only an integration test
# binary can install, and asserting it measured the FAST path needs this
# counter. Off by default — nothing in a shipped build compiles it.
test-hooks = []

[dependencies]
# AEAD: XChaCha20-Poly1305 — 192-bit nonce safe for random generation.
# `getrandom` and `rand_core` enable random nonce generation; the
# implementation also implements ZeroizeOnDrop on its cipher state via
# its dependencies (chacha20 + aead crates), so per-chunk keys are
# wiped when the ChunkAead drops.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "rand_core"] }
# Direct chacha20 for the TM1 constant-time-scan timing-equalizer
# (see `crypto::aead::equalize_timing_via_chacha20`). Already a
# transitive dep via chacha20poly1305 0.10; pinning here makes the
# direct use explicit and version-aligned.
chacha20 = { version = "0.9", default-features = false }
# Password-based KDF.
# `zeroize`: Argon2's working memory is m_cost KiB — 64 MiB at the default
# parameters — and it is the password's expansion. Without this feature it is
# freed as-is, so the claimed M1 memory-erasure contract held for the derived
# key and not for the buffer it was derived in (report9 HV-15).
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
# Fast keyed hash for per-chunk subkey derivation and Merkle nodes.
# `zeroize`: a keyed `Hasher`'s state and a `Hash` are key-equivalent — the
# hash IS the derived key at every site here — and neither is wiped on drop
# without this (report9 HV-15).
blake3 = { version = "1.5", default-features = false, features = ["zeroize"] }
# Zero-on-drop wrappers for key material.
zeroize = { version = "1.8", features = ["zeroize_derive"] }
# RNG. We use `getrandom` directly for nonce / salt / container_id
# generation; `rand_core` is a transitive dep via chacha20poly1305's
# `rand_core` feature (no direct use site in this crate).
getrandom = "0.2"
# Error plumbing.
thiserror = "1"
# In-memory chunk encoding (fixed-size, deterministic).
byteorder = "1.5"
# DataBatch compression for the message log namespace (DESIGN §11.4).
zstd = "0.13"
# Optional: argument parsing for the `hv` CLI binary.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"], optional = true }
# Optional: data-parallelism for the open-time discovery scan. Uses
# rayon's work-stealing pool. Only pulled in by `parallel-scan` feature.
rayon = { version = "1", optional = true }
# Optional: zero-copy mmap-backed scan path. Only pulled in by `mmap`
# feature.
memmap2 = { version = "0.9", optional = true }

# Two direct uses, both on Unix:
#
#   - Android lock implementation. Rust std's `File::try_lock` returns
#     `Unsupported "try_lock() not supported"` on Android since 1.89; we
#     call `flock(2)` directly instead. Pre-v1.0 the Android path was a
#     no-op (audit pass 18 M4 documented this as "safe only on
#     app-private storage"), but v1.0 hardens it by acquiring a real
#     flock so cross-process races on `android:process=":subname"`
#     configurations are correctly serialized.
#   - `tcgetattr`/`tcsetattr` in the `hv` CLI, to suppress terminal echo
#     while a password is typed (report6 P2). Widened from
#     `cfg(target_os = "android")` to `cfg(unix)` for it.
#
# Free in dependency terms: `libc` is already in the tree on every Unix
# via getrandom / zstd / memmap2 / rayon.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# One direct use: `GetConsoleMode`/`SetConsoleMode` in the `hv` CLI, to
# clear `ENABLE_ECHO_INPUT` while a password is typed (report7 P1) —
# the Windows half of what `tcsetattr` does above. It was left unwritten
# on the grounds that this host could not compile or run it, but `hv.exe`
# ships in every release and `windows-release-gate.yml` already runs this
# crate's tests on a Windows runner, so the shipped binary was printing
# passwords on screen.
#
# Cheap in dependency terms: `windows-sys` is already in the tree on
# Windows via getrandom / tempfile / zstd, and this pulls no new crates,
# only two more of its feature modules.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    # `MoveFileExW` with `MOVEFILE_WRITE_THROUGH` — the only durability barrier
    # Windows offers for a rename. See `rename_durable` in `container/mod.rs`.
    "Win32_Storage_FileSystem",
    # `CreateFileW` names `SECURITY_ATTRIBUTES` in its signature, so the
    # directory handle the parent-dir flush opens needs this too.
    "Win32_Security",
] }

[dev-dependencies]
proptest = "1.4"
tempfile = "3.10"
criterion = { version = "0.5", default-features = false }

# `openpty` for the CLI echo-suppression test: the property only exists
# when stdin IS a terminal, so proving it needs a real one. Unix only,
# same as the code it tests.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[bench]]
name = "throughput"
harness = false

[[bench]]
# TM1 — open-time scan timing-oracle micro-bench. See bench
# header for what passing looks like. Audit pass 8.
name = "timing_oracle"
harness = false

[[bin]]
name = "hv"
path = "src/bin/hv.rs"
required-features = ["cli"]
