name: release

# Signed release pipeline. Trigger policy matches the rest of the
# workspace (the local release checklist §4, ci.yml):
# - Push of a SemVer tag `v*.*.*` (e.g. `v1.0.0`, `v0.5.2-rc1`) — runs
#   the full pipeline: build → sign (cosign keyless) → publish to
#   GitHub Releases → cargo publish for non-`publish = false` crates.
# - Manual `workflow_dispatch` — supports a `dry_run` flag (default
#   `true`) so the pipeline can be exercised on a branch without
#   cutting a tag, touching crates.io, or creating a GitHub Release.
#
# `cargo publish` requires the `CARGO_REGISTRY_TOKEN` repo secret to be
# set AND the target crate's `publish = false` to be removed/flipped
# in `Cargo.toml`. As of 2026-05-28 every workspace crate has
# `publish = false`; the `cargo-publish` job auto-detects that and
# skips all crates by design. To enable publish for a crate, edit its
# `Cargo.toml` (and re-run `dump-public-api.sh`).
#
# Verification of the signed artifacts is documented in
# `docs/en/contributing/verifying-release.md` (RU: same path under
# `docs/ru/`).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run: build + sign locally, skip GitHub Release creation and run `cargo publish --dry-run` instead of real publish.'
        type: boolean
        default: true

# Default least-privilege; jobs that need more declare it explicitly.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Mirrors `ci.yml::release-build` matrix so this workflow is
    # self-contained (no cross-workflow artifact passing). The
    # duplicated build is intentional — the `ci.yml` job is the
    # unsigned smoke test, this one is the signing source of truth.
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          # Windows on ARM64. Cross-compiled from the x64 runner: the image
          # carries the VS ARM64 build tools, and `cc` picks the matching
          # `cl.exe` from the target triple, which is what `zstd` needs.
          # Without this leg a Windows ARM64 host had no build at all — the
          # x64 binary runs there under emulation, which is not what a
          # container tool with a hot crypto path should be doing.
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-${{ matrix.target }}

      # The `targets:` above lands on the toolchain THAT ACTION installs —
      # `stable`. This repository pins 1.97.1 in rust-toolchain.toml with
      # `targets = ["aarch64-linux-android", "x86_64-pc-windows-gnu"]`, so
      # every cargo invocation below switches to the pinned toolchain, where
      # the matrix target is not installed. `error[E0463]: can't find crate
      # for 'core'` is what that looks like from inside the build.
      #
      # It only shows on the legs where the target differs from the host:
      # the legs whose target IS the host build their own triple and were
      # green, which is why this reads as a partial failure rather than a
      # setup that never took effect at all.
      #
      # It could not have been caught before now. The pin arrived in da1d9fd,
      # after v1.2.3, and this workflow only fires on a tag — so v2.0.0 was
      # the first tag to meet it.
      - name: The cross target, on the toolchain cargo will actually use
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
          rustup target list --installed | grep -qx "${{ matrix.target }}" || {
            echo "::error::${{ matrix.target }} is still missing after target add"
            exit 1
          }

      # Cross-linker for aarch64-linux on x86_64 hosts.
      #
      # Bounded on purpose. Unqualified, this exact step -- same package, same
      # runner image -- wedged a sibling repository's release for two and a
      # half hours: the image runs unattended-upgrades, apt waits on the dpkg
      # lock forever by default, and a package that wants to ask something has
      # no terminal to ask on. DPkg::Lock::Timeout bounds the wait,
      # DEBIAN_FRONTEND answers for it, and the retry covers a mirror that is
      # briefly unreachable. Silence is the trap here: an unbounded apt looks
      # exactly like a slow build.
      # 25 minutes, not 10. The ceiling is a backstop, not the defence: the
      # dpkg-lock hang this step exists to bound is caught by
      # DPkg::Lock::Timeout in three minutes regardless. What the ceiling has
      # to tolerate is an ordinary slow day on the mirror -- 45 MB of cross
      # toolchain, and azure.archive.ubuntu.com has served 10 MB of it in five
      # minutes. Ten minutes killed a healthy install mid-download.
      - if: matrix.cross
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt_get() {
            sudo apt-get -o DPkg::Lock::Timeout=180 -o Acquire::Retries=3 "$@"
          }
          installed=0
          for attempt in 1 2 3; do
            # libc6-dev-arm64-cross is named on purpose. It reaches
            # gcc-aarch64-linux-gnu through Recommends, not Depends, so
            # --no-install-recommends installed the compiler without the
            # target libc headers and zstd-sys died on
            # bits/libc-header-start.h. Recommends are not a dependency
            # contract; say what the build needs.
            if apt_get update && apt_get install -y \
              gcc-aarch64-linux-gnu libc6-dev-arm64-cross; then
              installed=1
              break
            fi
            echo "apt attempt $attempt failed; retrying" >&2
            sleep $((attempt * 15))
          done
          if [ "$installed" -ne 1 ]; then
            echo "::error::apt failed three times installing gcc-aarch64-linux-gnu"
            exit 1
          fi
          mkdir -p .cargo
          cat >> .cargo/config.toml <<EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build hv CLI
        run: cargo build -p hidden-volume --release --features cli --target ${{ matrix.target }} --locked
      - name: Build FFI cdylib
        run: cargo build -p hidden-volume-ffi --release --target ${{ matrix.target }} --locked

      - name: Stage release artifacts
        shell: bash
        run: |
          # Per-target artifact names encode the target triple so the
          # final SHA256SUMS unambiguously identifies each binary, and
          # so files from different targets don't collide when
          # download-artifact merges them under one directory.
          mkdir -p dist
          prefix="${{ matrix.target }}"
          tdir="target/${{ matrix.target }}/release"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "$tdir/hv.exe" "dist/hv-${prefix}.exe"
            cp "$tdir/hidden_volume_ffi.dll" "dist/hidden_volume_ffi-${prefix}.dll"
          elif [[ "${{ matrix.target }}" == *darwin* ]]; then
            cp "$tdir/hv" "dist/hv-${prefix}"
            cp "$tdir/libhidden_volume_ffi.dylib" "dist/libhidden_volume_ffi-${prefix}.dylib"
          else
            cp "$tdir/hv" "dist/hv-${prefix}"
            cp "$tdir/libhidden_volume_ffi.so" "dist/libhidden_volume_ffi-${prefix}.so"
          fi
          ls -la dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage-${{ matrix.target }}
          path: dist/
          retention-days: 1

  sign-and-release:
    name: sign + GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create GitHub Release
      id-token: write   # cosign keyless OIDC token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stage-*
          path: dist/
          merge-multiple: true

      - name: Generate global SHA256SUMS
        run: |
          cd dist
          # `sort -k 2` makes the file deterministic regardless of
          # which per-target shard arrived first.
          sha256sum * | sort -k 2 > SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: cosign sign-blob (keyless OIDC)
        # Signs the SHA256SUMS file with a short-lived certificate
        # whose subject = the OIDC token of this workflow run. The
        # signature + cert chain + Rekor transparency-log entry are
        # bundled into a single self-contained file; verifiers do
        # NOT need to contact Sigstore servers at verify time.
        run: |
          cd dist
          cosign sign-blob --yes \
            --bundle SHA256SUMS.cosign.bundle \
            SHA256SUMS
          ls -la SHA256SUMS.cosign.bundle

      - name: Create GitHub Release
        # Always create on tag push; skip on workflow_dispatch+dry_run.
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Verifying this release

            Every release publishes a `SHA256SUMS` file plus a
            `SHA256SUMS.cosign.bundle` keyless-signed by this
            workflow's GitHub Actions OIDC identity (no long-lived
            signing keys — verifiable against the Sigstore Rekor
            transparency log).

            ```sh
            cosign verify-blob \
              --bundle SHA256SUMS.cosign.bundle \
              --certificate-identity-regexp 'https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/v.*' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              SHA256SUMS

            # Then verify each downloaded artifact matches its line in SHA256SUMS:
            sha256sum --ignore-missing -c SHA256SUMS    # Linux
            shasum -a 256 -c SHA256SUMS                 # macOS / BSD
            ```

            Full procedure (and what each step proves) lives in
            [`docs/en/contributing/verifying-release.md`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/en/contributing/verifying-release.md).

      - name: Upload signed bundle for dry-run inspection
        # In dry-run we don't create a GitHub Release, but we still
        # surface the signed bundle as a workflow artifact so the
        # maintainer can inspect / smoke-verify locally.
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dry-run-signed
          path: |
            dist/SHA256SUMS
            dist/SHA256SUMS.cosign.bundle
          retention-days: 7

  cargo-publish:
    name: cargo publish
    needs: [sign-and-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Detect publishable crates
        # `publish = false` in a crate's Cargo.toml is an explicit
        # opt-out. The crate is silently skipped; flip the flag (or
        # remove the line) to enable publish for the next tag.
        #
        # Every workspace crate has `publish = false`: the project ships
        # from this repository rather than crates.io, and putting it there
        # is still gated on external crypto-review. (This used to say the
        # project was "pre-1.0"; it is 2.x — the gate is the review, not
        # the version.) When
        # that gate clears, the maintainer flips the flag for the
        # crates that should ship publicly and the next tag publishes
        # them in dependency order.
        #
        # Order matters: a crate's deps must already be on crates.io
        # before it can be published. Workspace dependency graph:
        #
        #   hidden-volume    (no internal deps)
        #     └─ hidden-volume-rt
        #         ├─ hidden-volume-async
        #         └─ hidden-volume-ffi   (uniffi-internal; usually stays publish=false)
        id: detect
        shell: bash
        run: |
          PUBLISHABLE=()
          for crate in hidden-volume hidden-volume-rt hidden-volume-async hidden-volume-ffi; do
            f="crates/${crate}/Cargo.toml"
            if grep -qE '^publish[[:space:]]*=[[:space:]]*false' "$f"; then
              echo "SKIP   $crate (publish = false)"
            else
              PUBLISHABLE+=("$crate")
              echo "QUEUE  $crate"
            fi
          done
          echo "list=${PUBLISHABLE[*]}" >> "$GITHUB_OUTPUT"

      - name: cargo publish (real or --dry-run)
        if: steps.detect.outputs.list != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          DRY=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            DRY="--dry-run"
            echo "Running in dry-run mode: no crates will be uploaded to crates.io."
          else
            if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
              echo "::error::CARGO_REGISTRY_TOKEN secret is not set. Add it under repo Settings → Secrets and variables → Actions, or run this workflow with dry_run=true."
              exit 1
            fi
          fi
          for crate in ${{ steps.detect.outputs.list }}; do
            echo "::group::cargo publish $DRY -p $crate --locked"
            cargo publish $DRY -p "$crate" --locked
            # Real publishes need ~30-60s for crates.io to index the
            # new version before the next crate (which depends on it)
            # can resolve. Skip the wait on dry-run.
            if [[ -z "$DRY" ]]; then
              echo "Waiting 60s for crates.io to index $crate before the next publish..."
              sleep 60
            fi
            echo "::endgroup::"
          done

      - name: Nothing to publish
        if: steps.detect.outputs.list == ''
        run: |
          echo "All workspace crates have publish = false; cargo-publish job is a no-op for this tag."
          echo "To enable publish for a crate, remove or set 'publish = true' in its Cargo.toml,"
          echo "then push a new tag."
